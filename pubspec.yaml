name: cv_builder
description: "Professional Cross-Platform CV and Resume Builder with Multi-Language and PDF Export"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # PDF Generation and Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # File & Image Selection
  file_picker: ^8.1.4

  # Local Persistence
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Utilities
  intl: '>=0.19.0 <1.0.0'
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
